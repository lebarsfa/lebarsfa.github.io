<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Folder Listing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 28px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            padding: 8px 12px;
            border-bottom: 1px solid #e6e6e6;
            text-align: left;
        }

        th {
            cursor: pointer;
            background: #f7f7f7;
        }

            th:hover {
                background: #efefef;
            }

        .loading {
            color: #666;
            margin-bottom: 12px;
        }

        .hint {
            color: #a00;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <h2>Files</h2>
    <p id="loading" class="loading">Loading file list…</p>

    <table id="file-table" style="display: none;">
        <thead>
            <tr>
                <th onclick="sortBy('name')">Name</th>
                <th onclick="sortBy('size')">Size</th>
                <th onclick="sortBy('date')">Last Modified</th>
            </tr>
        </thead>
        <tbody id="file-body"></tbody>
    </table>

    <p id="hint" class="hint" style="display: none;"></p>

    <script>
        /* Robust inference:
           - If meta/data overrides exist, use them.
           - If hostname === owner.github.io -> user site: repo = owner.github.io, folder = pathParts.join('/')
           - Else if hostname endsWith github.io -> project site: repo = pathParts[0], folder = pathParts.slice(1).join('/')
           - Else try canonical link; otherwise show hint.
        */

        function getMeta(n) { const m = document.querySelector('meta[name="' + n + '"]'); return m ? m.getAttribute('content') : null }
        function getData(n) { return document.body.getAttribute('data-' + n) }

        function infer() {
            const overrideOwner = getMeta('gh-owner') || getData('gh-owner');
            const overrideRepo = getMeta('gh-repo') || getData('gh-repo');
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const host = window.location.hostname.toLowerCase();

            if (overrideOwner && overrideRepo) {
                return { owner: overrideOwner, repo: overrideRepo, folder: pathParts.join('/') };
            }

            if (host.endsWith('github.io')) {
                const owner = host.split('.')[0];
                // **CRITICAL FIX**: if hostname equals owner.github.io -> user site
                if (host === owner + '.github.io') {
                    // user site: repo is owner.github.io, folder is entire path
                    return { owner, repo: owner + '.github.io', folder: pathParts.join('/') };
                } else {
                    // project site served from username.github.io/project
                    if (pathParts.length === 0) return { owner, repo: owner + '.github.io', folder: '' };
                    const repo = pathParts[0];
                    const folder = pathParts.length > 1 ? pathParts.slice(1).join('/') : '';
                    return { owner, repo, folder };
                }
            }

            // try canonical link
            const canonical = document.querySelector('link[rel="canonical"]');
            if (canonical && canonical.href) {
                try {
                    const u = new URL(canonical.href);
                    if (u.hostname.endsWith('github.io')) {
                        const owner = u.hostname.split('.')[0];
                        const parts = u.pathname.split('/').filter(Boolean);
                        if (parts.length === 0) return { owner, repo: owner + '.github.io', folder: '' };
                        return { owner, repo: parts[0], folder: parts.length > 1 ? parts.slice(1).join('/') : '' };
                    }
                } catch (e) { }
            }

            return null;
        }

        function formatSize(bytes) {
            if (bytes == null) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        let fileData = [];
        let currentSort = { key: 'name', asc: true };

        function renderTable() {
            const tbody = document.getElementById('file-body');
            tbody.innerHTML = '';
            fileData.forEach(f => {
                const tr = document.createElement('tr');

                const tdName = document.createElement('td');
                const a = document.createElement('a');
                a.href = f.name;
                a.textContent = f.name;
                tdName.appendChild(a);

                const tdSize = document.createElement('td');
                tdSize.textContent = formatSize(f.size);

                const tdDate = document.createElement('td');
                tdDate.textContent = f.date ? new Date(f.date).toLocaleString() : '';

                tr.appendChild(tdName);
                tr.appendChild(tdSize);
                tr.appendChild(tdDate);
                tbody.appendChild(tr);
            });
        }

        function sortBy(key) {
            if (currentSort.key === key) currentSort.asc = !currentSort.asc;
            else { currentSort.key = key; currentSort.asc = true; }

            fileData.sort((a, b) => {
                let v1 = a[key], v2 = b[key];
                if (key === 'name') { v1 = v1.toLowerCase(); v2 = v2.toLowerCase(); }
                if (v1 < v2) return currentSort.asc ? -1 : 1;
                if (v1 > v2) return currentSort.asc ? 1 : -1;
                return 0;
            });
            renderTable();
        }

        (async function main() {
            const info = infer();
            const loading = document.getElementById('loading');
            const hintEl = document.getElementById('hint');

            if (!info) {
                loading.style.display = 'none';
                hintEl.style.display = 'block';
                hintEl.innerHTML = 'Could not infer GitHub owner/repo. For custom domains add meta tags:<br>' +
                    '<code>&lt;meta name="gh-owner" content="your-username"&gt;</code> and ' +
                    '<code>&lt;meta name="gh-repo" content="your-repo"&gt;</code>';
                return;
            }

            const owner = info.owner;
            const repo = info.repo;
            const folder = info.folder || '';

            try {
                const apiPath = folder ? `${encodeURIComponent(folder)}` : '';
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${apiPath}`;
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('GitHub API returned ' + resp.status);
                const files = await resp.json();

                const visibleFiles = (Array.isArray(files) ? files : []).filter(f => f.type === 'file');

                if (visibleFiles.length === 0) {
                    loading.textContent = 'No files found in this folder.';
                    document.getElementById('file-table').style.display = 'none';
                    return;
                }

                fileData = visibleFiles.map(f => ({ name: f.name, size: f.size, date: null }));

                // fetch last commit date for each file (parallel)
                await Promise.all(fileData.map(async (f) => {
                    try {
                        const commitsUrl = `https://api.github.com/repos/${owner}/${repo}/commits?path=${encodeURIComponent((folder ? folder + '/' : '') + f.name)}&page=1&per_page=1`;
                        const r = await fetch(commitsUrl);
                        if (!r.ok) return;
                        const commits = await r.json();
                        if (Array.isArray(commits) && commits[0] && commits[0].commit && commits[0].commit.author) {
                            f.date = new Date(commits[0].commit.author.date).getTime();
                        }
                    } catch (e) { }
                }));

                loading.style.display = 'none';
                document.getElementById('file-table').style.display = 'table';
                sortBy('name');
            } catch (err) {
                loading.textContent = 'Failed to load file list: ' + (err.message || err);
                console.error(err);
            }
        })();
    </script>

</body>
</html>
