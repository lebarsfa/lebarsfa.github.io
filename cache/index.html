<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cache Files</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            cursor: pointer;
            background: #f0f0f0;
        }

            th:hover {
                background: #e0e0e0;
            }

        .loading {
            color: #666;
        }
    </style>
</head>
<body>

    <h2>Cache Files</h2>
    <p class="loading" id="loading">Loading file list…</p>

    <table id="file-table" style="display: none;">
        <thead>
            <tr>
                <th onclick="sortBy('name')">Name</th>
                <th onclick="sortBy('size')">Size</th>
                <th onclick="sortBy('date')">Last Modified</th>
            </tr>
        </thead>
        <tbody id="file-body"></tbody>
    </table>

    <script>
        const owner = "lebarsfa";      // ← CHANGE THIS
        const repo = "lebarsfa.github.io";     // ← CHANGE THIS
        const path = "cache";

        let fileData = [];
        let currentSort = { key: "name", asc: true };

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            return (bytes / 1024 / 1024).toFixed(1) + " MB";
        }

        function renderTable() {
            const tbody = document.getElementById("file-body");
            tbody.innerHTML = "";

            fileData.forEach(f => {
                const tr = document.createElement("tr");

                const tdName = document.createElement("td");
                const a = document.createElement("a");
                a.href = f.name;
                a.textContent = f.name;
                tdName.appendChild(a);

                const tdSize = document.createElement("td");
                tdSize.textContent = formatSize(f.size);

                const tdDate = document.createElement("td");
                tdDate.textContent = new Date(f.date).toLocaleString();

                tr.appendChild(tdName);
                tr.appendChild(tdSize);
                tr.appendChild(tdDate);
                tbody.appendChild(tr);
            });
        }

        function sortBy(key) {
            if (currentSort.key === key) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.key = key;
                currentSort.asc = true;
            }

            fileData.sort((a, b) => {
                let v1 = a[key];
                let v2 = b[key];
                if (key === "name") {
                    v1 = v1.toLowerCase();
                    v2 = v2.toLowerCase();
                }
                if (v1 < v2) return currentSort.asc ? -1 : 1;
                if (v1 > v2) return currentSort.asc ? 1 : -1;
                return 0;
            });

            renderTable();
        }

        fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`)
            .then(response => response.json())
            .then(files => {
                document.getElementById("loading").style.display = "none";
                document.getElementById("file-table").style.display = "table";

                fileData = files
                    .filter(f => f.type === "file")
                    .map(f => ({
                        name: f.name,
                        size: f.size,
                        date: f.sha ? Date.now() : Date.now()  // fallback; GitHub API v3 doesn't give timestamps here
                    }));

                // Fetch timestamps via separate API calls
                fileData.forEach((f, i) => {
                    fetch(`https://api.github.com/repos/${owner}/${repo}/commits?path=${path}/${f.name}&page=1&per_page=1`)
                        .then(r => r.json())
                        .then(commits => {
                            if (commits && commits[0] && commits[0].commit) {
                                f.date = new Date(commits[0].commit.author.date).getTime();
                            }
                            if (i === fileData.length - 1) {
                                sortBy("name");
                            }
                        });
                });
            })
            .catch(err => {
                document.getElementById("loading").textContent =
                    "Failed to load file list.";
                console.error(err);
            });
    </script>

</body>
</html>
